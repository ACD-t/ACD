<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Материалы и инструменты — ACD</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="screen lesson-screen sphere-lesson-screen materials-lesson-screen" aria-label="Урок Материалы и инструменты">
      <a class="back-link" href="index.html" aria-label="Вернуться ко всем курсам">Все курсы</a>

      <header class="sphere-title-block">
        <h1 class="lesson-title">Материалы и инструменты</h1>
      </header>

      <section class="sphere-gallery" aria-label="Изображения урока">
        <button class="sphere-gallery-card" type="button" data-story-index="0" aria-label="Открыть изображение 1 из 6">
          <img src="assets/Материалы/material01.jpg" alt="Урок «Материалы и инструменты», изображение 1">
        </button>
        <button class="sphere-gallery-card" type="button" data-story-index="1" aria-label="Открыть изображение 2 из 6">
          <img src="assets/Материалы/material02.jpg" alt="Урок «Материалы и инструменты», изображение 2">
        </button>
        <button class="sphere-gallery-card" type="button" data-story-index="2" aria-label="Открыть изображение 3 из 6">
          <img src="assets/Материалы/material03.jpg" alt="Урок «Материалы и инструменты», изображение 3">
        </button>
        <button class="sphere-gallery-card" type="button" data-story-index="3" aria-label="Открыть изображение 4 из 6">
          <img src="assets/Материалы/material04.jpg" alt="Урок «Материалы и инструменты», изображение 4">
        </button>
        <button class="sphere-gallery-card" type="button" data-story-index="4" aria-label="Открыть изображение 5 из 6">
          <img src="assets/Материалы/material05.jpg" alt="Урок «Материалы и инструменты», изображение 5">
        </button>
        <button class="sphere-gallery-card" type="button" data-story-index="5" aria-label="Открыть изображение 6 из 6">
          <img src="assets/Материалы/material06.jpg" alt="Урок «Материалы и инструменты», изображение 6">
        </button>
      </section>
    </main>

    <div class="story-viewer" id="story-viewer" hidden>
      <section class="story-viewer-panel" role="dialog" aria-modal="true" aria-label="Просмотр урока Материалы и инструменты в формате stories">
        <header class="story-header">
          <h2>Материалы и инструменты</h2>
          <button class="story-close" type="button" aria-label="Закрыть stories">
            <img src="assets/ui/story-close.svg" alt="">
          </button>
        </header>

        <div class="story-progress" role="progressbar" aria-label="Прогресс просмотра" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
          <span class="story-progress-segment" data-progress-index="0"></span>
          <span class="story-progress-segment" data-progress-index="1"></span>
          <span class="story-progress-segment" data-progress-index="2"></span>
          <span class="story-progress-segment" data-progress-index="3"></span>
          <span class="story-progress-segment" data-progress-index="4"></span>
          <span class="story-progress-segment" data-progress-index="5"></span>
        </div>

        <button class="story-stage" type="button" aria-label="Перейти к следующему изображению">
          <img id="story-image" src="assets/Материалы/materials1.jpg" alt="Урок «Материалы и инструменты», изображение 1">
        </button>
      </section>
    </div>

    <script>
      (() => {
        const lessonTitle = "Материалы и инструменты";
        const slides = Array.from(document.querySelectorAll(".sphere-gallery-card"));
        const sources = slides.map((slide) => slide.querySelector("img").src);
        const viewer = document.getElementById("story-viewer");
        const panel = viewer.querySelector(".story-viewer-panel");
        const stage = viewer.querySelector(".story-stage");
        const image = document.getElementById("story-image");
        const closeButton = viewer.querySelector(".story-close");
        const progress = Array.from(viewer.querySelectorAll(".story-progress-segment"));
        const progressBar = viewer.querySelector(".story-progress");
        let current = 0;
        let previousFocus = null;
        let pointerStart = null;

        const render = () => {
          image.src = sources[current];
          image.alt = "Урок «" + lessonTitle + "», изображение " + (current + 1);
          progressBar.setAttribute("aria-valuenow", String(current + 1));
          progress.forEach((segment, index) => {
            segment.classList.toggle("is-complete", index < current);
            segment.classList.toggle("is-current", index === current);
          });
        };

        const openStory = (index) => {
          current = index;
          previousFocus = document.activeElement;
          viewer.hidden = false;
          document.body.classList.add("story-open");
          render();
          closeButton.focus();
        };

        const closeStory = () => {
          viewer.hidden = true;
          document.body.classList.remove("story-open");
          if (previousFocus) previousFocus.focus();
        };

        const move = (direction) => {
          const next = current + direction;
          if (next < 0) return;
          if (next >= sources.length) {
            closeStory();
            return;
          }
          current = next;
          render();
        };

        slides.forEach((slide, index) => slide.addEventListener("click", () => openStory(index)));
        closeButton.addEventListener("click", closeStory);
        viewer.addEventListener("click", (event) => {
          if (event.target === viewer) closeStory();
        });
        stage.addEventListener("click", (event) => {
          const bounds = stage.getBoundingClientRect();
          move(event.clientX < bounds.left + bounds.width * 0.35 ? -1 : 1);
        });
        stage.addEventListener("pointerdown", (event) => {
          pointerStart = event.clientX;
        });
        stage.addEventListener("pointerup", (event) => {
          if (pointerStart === null) return;
          const distance = event.clientX - pointerStart;
          pointerStart = null;
          if (Math.abs(distance) > 40) move(distance < 0 ? 1 : -1);
        });
        document.addEventListener("keydown", (event) => {
          if (viewer.hidden) return;
          if (event.key === "Escape") closeStory();
          if (event.key === "ArrowRight") move(1);
          if (event.key === "ArrowLeft") move(-1);
          if (event.key === "Tab" && !panel.contains(document.activeElement)) {
            event.preventDefault();
            closeButton.focus();
          }
        });
      })();
    </script>
  </body>
</html>
