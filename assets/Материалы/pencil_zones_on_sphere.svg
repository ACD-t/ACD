<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Затенённый шар с бликом, светом, полутоном, ядром тени и падающей тенью. Четыре карандаша справа стрелками указывают: 2H в свет, B в полутон, 5B в ядро тени, 3B в падающую тень.</desc>
